<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - my Dream Place</title>
    <link rel="stylesheet" href="/Password/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <header class="header">
        <div class="header1">
            <div class="marca">
                <span class="icono">
                    <img src="/Password/imagenes/Group (3).png" alt="">
                </span>
                <span class="texto-marca">my Dream Place</span>
            </div>
        </div>
    </header>

    <main class="forgot">
        <h1 class="titulo">Forgot your password?</h1>

        <p class="descripcion">
            We’ll send you a link to reset it. Enter your email address
            used for My Dream Place
        </p>

        <form class="formulario">
            <div class="campo">
                <label class="etiqueta">Your email address</label>
                <input type="email" class="entrada">
            </div>

            <button type="submit" class="boton-primario">
                Send Reset Link
            </button>

            <p class="texto-legal">
                By creating an account, you agree with our
                <a href="#">Terms and Conditions</a> and
                <a href="#">Privacy Statement</a>.
            </p>
        </form>
    </main>

</body>
</html>
