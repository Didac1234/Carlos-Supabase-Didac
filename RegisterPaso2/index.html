<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create password - my Dream Place</title>
    <link rel="stylesheet" href="/RegisterPaso2/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://kit.fontawesome.com/6863636b69.js" crossorigin="anonymous"></script>

</head>
<body>

    <header class="header">
        <div class="header1">
            <div class="marca">
                <span class="icono-marca"><img src="/RegisterPaso2/imagenes/Group (3).png" alt=""></span>
                <span class="texto-marca">my Dream Place</span>
            </div>
        </div>
    </header>

    <main class="password">
        <h1 class="titulo">Create password</h1>
        <p class="subtitulo">Use a minimum of 10 characters, including letters, lowercase letters, and numbers.</p>

        <form class="formulario">
            <div class="campo">
                <label class="etiqueta">Password</label>
                <div class="entrada-icono">
                    <input type="password" class="entrada">
                    <span class="icono-ojo"><i class="fa-solid fa-eye"></i></span>
                </div>
            </div>

            <div class="campo">
                <label class="etiqueta">Confirm password</label>
                <div class="entrada-icono">
                    <input type="password" class="entrada">
                    <span class="icono-ojo"><i class="fa-solid fa-eye"></i></span>
                </div>
            </div>

            <button type="submit" class="boton">Create account</button>

            <p class="terminos">
                By creating an account, you agree with our <a href="#">Terms and Conditions</a> and <a href="#">Privacy Statement</a>.
            </p>
        </form>
    </main>

</body>
</html>
