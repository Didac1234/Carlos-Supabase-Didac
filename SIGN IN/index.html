<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in - my Dream Place</title>
    <link rel="stylesheet" href="/SIGN IN/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://kit.fontawesome.com/6863636b69.js" crossorigin="anonymous"></script>

</head>
<body>

    <header class="header">
        <div class="header1">
            <div class="marca">
                <span class="icono-marca"><img src="/SIGN IN/imagenes/Group (3).png" alt=""></span>
                <span class="texto-marca">my Dream Place</span>
            </div>
        </div>
    </header>

    <main class="login">
        <h1 class="titulo">Sign in</h1>

        <form class="formulario">
            <div class="campo">
                <label class="etiqueta">Email address</label>
                <input type="email" class="entrada">
            </div>

            <div class="campo">
                <label class="etiqueta">Password</label>
                <div class="password">
                    <input type="password" class="entrada">
                    <span class="icono-ojo"><i class="fa-solid fa-eye"></i></span>
                </div>
            </div>

            <div class="opciones-secundarias">
                <label class="recordar">
                    <input type="checkbox"> Keep me signed in
                </label>
                <a href="#" class="enlace-olvido">Forgot password?</a>
            </div>

            <button type="submit" class="boton">Continue with email</button>

            <div class="separador">
                <span class="texto-separador">or use one of these options</span>
            </div>

            <button type="button" class="boton-social google">
                <img src="/SIGN IN/imagenes/image 4.png" alt="Google">
                Continue with Google
            </button>

            <button type="button" class="boton-social facebook">
                <img src="/SIGN IN/imagenes/facebook 1.png" alt="Facebook">
                Continue with Facebook
            </button>

            <p class="texto-registro">
                Don't have an account? <a href="#" class="enlace-registro">Register</a>
            </p>
        </form>
    </main>

</body>
</html>
