<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - my Dream Place</title>
    <link rel="stylesheet" href="/RegisterPaso1/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <header class="header">
        <div class="header1">
            <div class="marca">
                <span class="icono-marca"><img src="/RegisterPaso1/imagenes/Group (3).png" alt=""></span>
                <span class="texto-marca">my Dream Place</span>
            </div>
        </div>
    </header>

    <main class="registro">
        <h1 class="titulo">Register</h1>

        <form class="formulario">
            <div class="campo">
                <label class="etiqueta">Email address</label>
                <input type="email" class="entrada">
            </div>

            <button type="submit" class="boton-primario">Continue with email</button>

            <div class="separador">
                <span class="texto-separador">or use one of these options</span>
            </div>

            <button type="button" class="boton-social google">
                <img src="/RegisterPaso1/imagenes/image 4.png" alt="Google">
                Continue with Google
            </button>

            <button type="button" class="boton-social facebook">
                <img src="/RegisterPaso1/imagenes/facebook 1.png" alt="Facebook">
                Continue with Facebook
            </button>

            <p class="texto-login">
                Already have an account? <a href="login.html" class="enlace-login">Sign in</a>
            </p>
        </form>
    </main>

</body>
</html>
